# dsh-claude host bundle. The preset stays inside this package as a system
# preset, so removing the profile dependency removes the complete integration.
- id: agent-presets
  config:
    default: standard
    roots:
      - path: !!js "process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(ctx.baseUrl).resolve('dsh-claude-any-model/package.json')), 'preset')"
        trust: system

- insert:
    - id: llm-claude
      name: 'dsh-claude-any-model'
